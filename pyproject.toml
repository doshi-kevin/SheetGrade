[project]
name = "sheetgrade"
version = "0.1.0"
description = "Structure-aware grading of spreadsheet submissions against an instructor answer key"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Kevin Dohsi", email = "kevin.doshi2@spit.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "formulas>=1.3.4",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "python-calamine>=0.8.2",
]

[project.scripts]
sheetgrade = "sheetgrade:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
